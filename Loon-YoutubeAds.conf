#!name = YouTube 增强 & 去广告 (Loon 3.5.1 适配版)
#!desc = 适配 Loon 3.5.1 新版 Rewrite/Script 引擎，整合去广告与界面优化
#!icon = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png

[Argument]
blockUpload = switch, true, tag=屏蔽上传按钮, desc=是否屏蔽上传按钮
blockImmersive = switch, true, tag=屏蔽选段按钮, desc=是否屏蔽选段按钮
blockShorts = switch, false, tag=屏蔽Shorts按钮, desc=是否屏蔽Shorts按钮
captionLang = input, "off", tag=字幕翻译语言, desc=语言代码填入 off 关闭翻译
debug = switch, false, tag=启用调试模式, desc=是否启用调试模式输出更多日志

[Rule]
# 拦截 QUIC 强制走 TCP/HTTPS
AND,((DOMAIN-SUFFIX,youtube.com),(PROTOCOL,QUIC)),REJECT-DROP
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,QUIC)),REJECT-DROP
AND,((DOMAIN-SUFFIX,ggpht.com),(PROTOCOL,QUIC)),REJECT-DROP
AND,((DOMAIN-SUFFIX,ytimg.com),(PROTOCOL,QUIC)),REJECT-DROP
AND,((DOMAIN-SUFFIX,gstatic.com),(PROTOCOL,QUIC)),REJECT-DROP
AND,((DOMAIN-SUFFIX,googleusercontent.com),(PROTOCOL,QUIC)),REJECT-DROP
AND,((DOMAIN-SUFFIX,suggestqueries.google.com),(PROTOCOL,QUIC)),REJECT-DROP
AND,((DOMAIN-SUFFIX,youtubei.googleapis.com),(PROTOCOL,QUIC)),REJECT-DROP

[Script]
# YouTube 界面与广告处理脚本 (响应)
http-response ^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config) script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js, requires-body=true, binary-body-mode=true, timeout=30, tag=YouTube去广告-响应

# YouTube 请求初始化脚本
http-request ^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.* script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js, requires-body=true, binary-body-mode=true, tag=YouTube去广告-请求

# YouTube 日志屏蔽脚本
http-request ^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js, requires-body=true, binary-body-mode=true, tag=YouTube去广告-日志

[Rewrite]
# 广告统计接口拦截
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads reject
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) reject
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext reject
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad reject

# 移除画质限制参数
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?&ctier=L reject

[MITM]
hostname = *.googlevideo.com, youtubei.googleapis.com, www.youtube.com, s.youtube.com
