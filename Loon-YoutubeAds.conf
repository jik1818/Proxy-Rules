#!name = Youtube去广告
#!desc = 支持PIP，后台播放，插件内置QUIC阻断
#!author = jik1818 
#!homepage = https://github.com/jik1818/Proxy-Rules
#!icon = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png

[Host]
# 插件原生支持 [Host]，在此最底层精准掐断 QUIC (UDP 443)，迫使降级 TCP
*.googlevideo.com = reject-quic
*.youtube.com = reject-quic
googlevideo.com = reject-quic
youtube.com = reject-quic

[Script]
http-response ^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch)(\?.*)?$ requires-body=1,binary-body-mode=1,timeout=20,tag=YouTube去广告,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js

[Rewrite]
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) 302 $1$2$3
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad reject

[Map Local]
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads reject
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) reject
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext reject

[MITM]
hostname = youtubei.googleapis.com, *.googlevideo.com, www.youtube.com, s.youtube.com
