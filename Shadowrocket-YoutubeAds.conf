#!name=Youtube (jik1818) Enhance
#!desc=適用於 Youtube & Youtube Music (小火箭切歌防報錯優化版)
#!arguments=屏蔽上傳按鈕:true,屏蔽選段按鈕:true,屏蔽Shorts按鈕:false,字幕翻譯語言:off,啟用調試模式:false
#!arguments-desc=- 屏蔽參數：[true, false] \n- 翻譯參數：[語言代碼, off] \n\n1. 語言代碼遵循 Google Translate Languages Codes, 當填入 off 時關閉翻譯\n2. 開啟調試模式用於輸出更多日誌

[Rule]
# 攔截 YouTube QUIC
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,youtube.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,googlevideo.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,ggpht.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,ytimg.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,gstatic.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,googleusercontent.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,suggestqueries.google.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,youtubei.googleapis.com)),REJECT-DROP

[Script]
# 1. 完全保留原版去廣告核心響應腳本（保障 0 廣告）
youtube.response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config))(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js,argument="{"captionLang":"{{{字幕翻譯語言}}}","blockUpload":{{{屏蔽上傳按鈕}}},"blockImmersive":{{{屏蔽選段按鈕}}},"blockShorts":{{{屏蔽Shorts按鈕}}},"debug":{{{啟用調試模式}}}}"

# 2. 小火箭修復關鍵：移除 init 腳本的 binary-body-mode=1，大幅提升切歌預載速度，防播放錯誤
youtube.request.init = type=http-request,pattern=^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.*,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js,argument="{"captionLang":"{{{字幕翻譯語言}}}"}"

# 3. 日誌處理腳本
youtube.request.log_event = type=http-request,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js

[MITM]
hostname = %APPEND% *.googlevideo.com, youtubei.googleapis.com
