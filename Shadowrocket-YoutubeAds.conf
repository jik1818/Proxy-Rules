#!name=YouTube & YTM Lite (Adblock Fix 2)
#!desc=修复版：补全 googlevideo 视频广告底层拦截，彻底清除片头与片中广告。

[Rule]
# 拦截 YouTube QUIC
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,youtube.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,googlevideo.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,ggpht.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,ytimg.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,gstatic.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,googleusercontent.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,suggestqueries.google.com)),REJECT-DROP
AND,((PROTOCOL,UDP),(DOMAIN-SUFFIX,youtubei.googleapis.com)),REJECT-DROP

[Script]
# 核心响应脚本（处理界面与元数据广告）
youtube.response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config)(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js,argument="{"captionLang":"off","blockUpload":true,"blockImmersive":true,"blockShorts":false,"debug":false}"

# 日志处理脚本
youtube.request.log_event = type=http-request,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js

[Rewrite]
# 补全：精准拦截片头/片中视频广告流 (googlevideo.com)
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad reject
^https?:\/\/[\w-]+\.googlevideo\.com\/videoplayback\?.+&ctier=L reject

# 拦截广告追踪与统计接口
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads reject
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) reject
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext reject

[MITM]
hostname = %APPEND% *.googlevideo.com, youtubei.googleapis.com
